# Docker Compose para desarrollo local — AI Hub
# NOTA: Solo incluye Meilisearch. PostgreSQL usa el contenedor existente fcp_db.
# Conectar con: docker-compose up -d

services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: aihub_meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      # En producción, agregar: MEILI_MASTER_KEY=tu-clave-maestra
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meilisearch_data:
    driver: local
