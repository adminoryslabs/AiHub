# Stack de producción de AI Hub en la VPS compartida de OrysLabs.
# Imágenes construidas en CI y publicadas en GHCR — nunca se buildea acá.
# Traefik es la única puerta de entrada: ningún servicio publica puertos.

services:
  app:
    image: ghcr.io/adminoryslabs/aihub-app:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      meilisearch:
        condition: service_healthy
    env_file: [app.env]
    environment:
      MEILISEARCH_HOST: http://meilisearch:7700
    networks: [edge, data, internal]
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.00"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      # Tres redes conectadas, hay que decirle a Traefik cuál marcar.
      - traefik.docker.network=edge
      - traefik.http.routers.aihub-app.rule=Host(`api-aihub.oryslabs.com`)
      - traefik.http.routers.aihub-app.entrypoints=websecure
      - traefik.http.routers.aihub-app.tls.certresolver=letsencrypt
      - traefik.http.routers.aihub-app.priority=10
      - traefik.http.services.aihub-app.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Privado: solo alcanzable desde `app`, nunca expuesto vía Traefik.
  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    env_file: [app.env]
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:7700/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=false

  migrate:
    image: ghcr.io/adminoryslabs/aihub-app:${IMAGE_TAG}
    command: ["npm", "run", "migrate"]
    env_file: [app.env]
    networks: [data]
    restart: "no"
    labels:
      - traefik.enable=false

volumes:
  meilisearch_data:

networks:
  edge:
    external: true
  data:
    external: true
  internal:
